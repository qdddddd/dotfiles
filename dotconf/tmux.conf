# ----------------------
# General Settings
# ----------------------
set -g visual-activity on
set -g default-command "${SHELL} -l"

set -g mode-keys vi
set -g history-limit 10000

# make vim a bit faster
set -s escape-time 5

set -sg escape-time 1
set -g base-index 1
setw -g pane-base-index 1

# Mouse works as expected
set -g mouse on

# maximize the window size to the bigger one
setw -g aggressive-resize
if-shell "$TERM_PROGRAM =~ ^iTerm" "setw -g aggressive-resize off"

# re-number windows when one is closed
set -g renumber-windows on

# word separators for automatic word selection
setw -g word-separators ' @"=()[]_-:,.'
setw -ag word-separators "'"

setw -g automatic-rename on
set -g set-clipboard on

# ----------------------
# Key Bindings
# ----------------------
# Prefix is Ctrl-q
unbind C-b
set -g prefix C-q
bind C-q send-prefix

# Do not copy selection and cancel copy mode on drag end event
unbind -T copy-mode-vi MouseDragEnd1Pane
# Instead, select, then mouse click to copy to buffer
bind -T copy-mode-vi MouseDown1Pane select-pane \; send-keys -X copy-selection \; send-keys -X clear-selection

# y and p as in vim
bind a copy-mode
unbind p
bind p paste-buffer
bind-key -T copy-mode-vi 'v' send-keys -X begin-selection
bind-key -T copy-mode-vi 'y' send-keys -X copy-selection-and-cancel

# extra commands for interacting with the ICCCM clipboard
bind C-c run 'tmux save-buffer - | bash -c "command -v pbcopy >/dev/null 2>&1 && pbcopy || xclip -i -sel clipboard"'
bind C-v run 'tmux set-buffer "$(xclip -o -sel clipboard 2>/dev/null)"; tmux paste-buffer'

# easy-to-remember split pane commands
# -c "$HOME" starts new windows/panes in ~ rather than inheriting the
# directory the tmux client was launched from (tmux's default since 1.9)
bind c new-window -c "$HOME"
bind v split-window -h -c "$HOME"
bind s split-window -v -c "$HOME"
unbind '"'
unbind %

# moving between windows with vim movement keys
bind -r C-h select-window -t :-
bind -r C-l select-window -t :+

# toggle synchronize-panes
bind -n C-s setw synchronize-panes

# source config
bind-key r source-file $HOME/.tmux.conf \; display-message "tmux.conf is reloaded"

# vim-tmux-navigator. See: https://github.com/christoomey/vim-tmux-navigator
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind-key h if-shell "$is_vim" "send-keys ˙"  "select-pane -L"
bind-key j if-shell "$is_vim" "send-keys ∆"  "select-pane -D"
bind-key k if-shell "$is_vim" "send-keys ˚"  "select-pane -U"
bind-key l if-shell "$is_vim" "send-keys ¬"  "select-pane -R"
#bind-key \ if-shell "$is_vim" "send-keys «"  "select-pane -l"
bind-key -T copy-mode-vi C-h select-pane -L
bind-key -T copy-mode-vi C-j select-pane -D
bind-key -T copy-mode-vi C-k select-pane -U
bind-key -T copy-mode-vi C-l select-pane -R
#bind-key -T copy-mode-vi C-\ select-pane -l

# swap the only two panes in a window
bind ` swap-pane -s 1 -t 2

# popup window
bind f display-popup -E -w 50% -h 50% -d '#{pane_current_path}'

# focus this window's ccmux sidebar with its cursor on this pane's session
# (sidebar pane id kept in window option @ccmux_tab_sidebar)
bind e run-shell 'sb="#{@ccmux_tab_sidebar}"; [ -n "$sb" ] && tmux set -p -t "$sb" @ccmux_jump_from "#{pane_id}" \; select-pane -t "$sb" || tmux display-message "no ccmux sidebar in this window"'

# ----------------------
# Status Bar
# ----------------------
set -g status-position top
setw -g monitor-activity off
set -g bell-action any
setw -g monitor-bell on
set -g window-status-bell-style "fg=black,bg=yellow,bold"
set -g status-justify centre

set -g status-interval 120
set -g status-left-length 30
set -g status-right-length 30

set -g status-left ' [ #S | #(hostname) ]'
set -g status-right '#(date +"%a %b %_d %H:%M") '

# define colour variables
DARK_BLUE="#076678"
BLUE="#83a598"
ORANGE="#d65d01"
LIGHT_GRAY="#d5c4a1"
BLACK="#1d2021"
PURPLE="#b16286"
AQUA="#427b58"
YELLOW="#fabd2f"
BGD3="#665c54"
BGL2="#d5c4a1"
BGL0="#fbf1c7"
CURSORLINE="#7c6f64"

STATUS_BG=$AQUA
STATUS_FG=$LIGHT_GRAY
INACTIVE_FG=$LIGHT_GRAY
ACTIVE_FG=$STATUS_FG
SYN_BG=$ACTIVE_FG
SYN_FG=$STATUS_BG

# default statusbar colors
set -g status-style bg=$STATUS_BG,fg=$STATUS_FG

# default window title style (splits: │|)
setw -g window-status-format "#{?#{==:#I,1},,| }#I: #{?window_bell_flag,▲ ,}#W#F"
setw -g window-status-style bg=default,fg=$INACTIVE_FG

# active window title colors
window_format="#[fg=$ACTIVE_FG,bg=default,bright]#I#[fg=default,bg=default,default].#P:#[fg=#{?pane_synchronized,$STATUS_BG,$ACTIVE_FG},bg=#{?pane_synchronized,$ACTIVE_FG,default},bright] #{?window_bell_flag,▲ ,}#W#F"
setw -g window-status-current-style fg=default
setw -g window-status-current-format "#{?#{==:#I,1},,| }"$window_format

# pane border — high-visibility splitter
set -g pane-border-lines single                        # original thin line width
set -g pane-border-style bg=default,fg=$BGL2           # inactive: thin BGL2 line #f9f5d7
#set -g pane-active-border-style bg=$DARK_BLUE,fg=$BGL2 # active: same BGL2 line on a deep-blue highlight
set -g pane-active-border-style bg=default,fg=$AQUA # active: same BGL2 line on a deep-blue highlight
#set -g pane-border-indicators both                     # arrows + colour mark the active pane
set -g pane-border-indicators arrows                   #   arrows only (no half-colour on 2-pane windows)

# message text
set -g message-style bg=$STATUS_BG,fg=$ACTIVE_FG

# pane number display
set -g display-panes-active-colour $DARK_BLUE
set -g display-panes-colour $ORANGE

# clock
setw -g clock-mode-colour $PURPLE

# ----------------------
# Plugins
# ----------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @resurrect-save 'S'
set -g @resurrect-restore 'R'
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-processes 'ssh'
set -g @continuum-restore 'on'

run '~/.tmux/plugins/tpm/tpm'

# ----------------------
# Anything Needs to Be at the Bottom
# ----------------------
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -ga terminal-overrides ',*:Ss=\E[%p1%d q:Se=\E[4 q'
set -ga update-environment " PATH"
set -g allow-passthrough on
set -ga terminal-overrides ',*:Ms=\E]52;%p1%s;%p2%s\007'
